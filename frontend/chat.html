<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContractGuard - Chat</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="dashboard-layout">
        <nav class="sidebar">
            <div class="logo">ContractGuard</div>
            <ul class="nav-links">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="upload.html">Upload</a></li>
                <li><a href="analysis.html">Analysis</a></li>
                <li><a href="chat.html" class="active">Chat</a></li>
                <li><a href="compare.html">Compare</a></li>
                <li><a href="deadlines.html">Deadlines</a></li>
                <li><a href="settings.html">Settings</a></li>
                <li><a href="#" id="logout-btn">Logout</a></li>
            </ul>
        </nav>
        <main class="content">
            <header>
                <h2>Chat with Contract</h2>
            </header>
            <div class="chat-container">
                <div class="chat-messages" id="chat-messages">
                    <p><strong>Bot:</strong> Hello! Ask me anything about the uploaded contract.</p>
                </div>
                <div class="chat-input">
                    <input type="text" id="chat-input-field" placeholder="Ask a question..." class="form-group">
                    <button class="btn btn-primary" id="send-btn">Send</button>
                </div>
            </div>
        </main>
    </div>
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
