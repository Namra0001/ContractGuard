<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContractGuard - Settings</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Custom Theme -->
    <link rel="stylesheet" href="css/theme.css">
</head>
<body class="bg-gray-50 dark:bg-slate-900 text-slate-900 dark:text-slate-50 min-h-screen transition-colors duration-300 overflow-hidden flex">

    <!-- Mobile sidebar overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden lg:hidden transition-opacity"></div>

    <!-- Sidebar -->
    <nav id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 z-50 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 flex flex-col">
        <!-- Logo -->
        <div class="h-16 flex items-center px-6 border-b border-slate-200 dark:border-slate-700">
            <div class="h-8 w-8 bg-brand-600 rounded-lg flex items-center justify-center mr-3 shadow-sm">
                <i data-lucide="shield-check" class="text-white h-5 w-5"></i>
            </div>
            <span class="text-xl font-bold text-slate-900 dark:text-white">ContractGuard</span>
        </div>

        <!-- Navigation Links -->
        <div class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
            <a href="dashboard.html" class="flex items-center px-3 py-2.5 text-sm font-medium rounded-lg text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50 group transition-colors">
                <i data-lucide="layout-dashboard" class="h-5 w-5 mr-3 text-slate-400 group-hover:text-slate-500 dark:text-slate-400 dark:group-hover:text-slate-300"></i>
                Dashboard
            </a>
            <a href="upload.html" class="flex items-center px-3 py-2.5 text-sm font-medium rounded-lg text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50 group transition-colors">
                <i data-lucide="upload-cloud" class="h-5 w-5 mr-3 text-slate-400 group-hover:text-slate-500 dark:text-slate-400 dark:group-hover:text-slate-300"></i>
                Upload Contract
            </a>
            <a href="analysis.html" class="flex items-center px-3 py-2.5 text-sm font-medium rounded-lg text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50 group transition-colors">
                <i data-lucide="file-search" class="h-5 w-5 mr-3 text-slate-400 group-hover:text-slate-500 dark:text-slate-400 dark:group-hover:text-slate-300"></i>
                Analysis
            </a>
            <a href="chat.html" class="flex items-center px-3 py-2.5 text-sm font-medium rounded-lg text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50 group transition-colors">
                <i data-lucide="message-square" class="h-5 w-5 mr-3 text-slate-400 group-hover:text-slate-500 dark:text-slate-400 dark:group-hover:text-slate-300"></i>
                AI Chat
            </a>
            <a href="compare.html" class="flex items-center px-3 py-2.5 text-sm font-medium rounded-lg text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50 group transition-colors">
                <i data-lucide="split-square-horizontal" class="h-5 w-5 mr-3 text-slate-400 group-hover:text-slate-500 dark:text-slate-400 dark:group-hover:text-slate-300"></i>
                Compare
            </a>
            <a href="deadlines.html" class="flex items-center px-3 py-2.5 text-sm font-medium rounded-lg text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50 group transition-colors">
                <i data-lucide="calendar" class="h-5 w-5 mr-3 text-slate-400 group-hover:text-slate-500 dark:text-slate-400 dark:group-hover:text-slate-300"></i>
                Deadlines
            </a>
        </div>

        <!-- Bottom Links -->
        <div class="p-4 border-t border-slate-200 dark:border-slate-700 space-y-1">
            <a href="#" class="flex items-center px-3 py-2 text-sm font-medium rounded-lg text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50 transition-colors">
                <i data-lucide="help-circle" class="h-5 w-5 mr-3 text-slate-400"></i>
                Help / Support
            </a>
            <a href="settings.html" class="flex items-center px-3 py-2 text-sm font-medium rounded-lg bg-brand-50 text-brand-700 dark:bg-brand-900/50 dark:text-brand-300 group transition-colors">
                <i data-lucide="settings" class="h-5 w-5 mr-3 text-brand-600 dark:text-brand-400"></i>
                Settings
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0 lg:pl-64 h-screen relative">
        
        <!-- Header -->
        <header class="sticky top-0 z-30 flex-shrink-0 h-16 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 flex items-center justify-between px-4 sm:px-6">
            <div class="flex items-center">
                <button id="mobile-menu-btn" class="lg:hidden mr-4 text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 focus:outline-none">
                    <i data-lucide="menu" class="h-6 w-6"></i>
                </button>
                <h1 class="text-lg font-semibold text-slate-900 dark:text-white">Settings</h1>
            </div>
            <div class="flex items-center space-x-4">
                <button id="dark-mode-toggle" class="text-slate-400 hover:text-slate-500 dark:hover:text-slate-300 transition-colors">
                    <i data-lucide="moon" class="h-5 w-5 hidden dark:block"></i>
                    <i data-lucide="sun" class="h-5 w-5 block dark:hidden"></i>
                </button>
            </div>
        </header>

        <!-- Main Scrollable Area -->
        <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
            <div class="max-w-5xl mx-auto flex flex-col md:flex-row gap-8">
                
                <!-- Settings Sidebar -->
                <div class="w-full md:w-64 flex-shrink-0">
                    <nav class="space-y-1">
                        <a href="#" class="flex items-center px-3 py-2 text-sm font-medium rounded-lg bg-slate-100 text-slate-900 dark:bg-slate-800 dark:text-white transition-colors">
                            <i data-lucide="user" class="h-5 w-5 mr-3 text-slate-500 dark:text-slate-400"></i>
                            Profile
                        </a>
                        <a href="#" class="flex items-center px-3 py-2 text-sm font-medium rounded-lg text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                            <i data-lucide="shield" class="h-5 w-5 mr-3 text-slate-400"></i>
                            Security
                        </a>
                        <a href="#" class="flex items-center px-3 py-2 text-sm font-medium rounded-lg text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                            <i data-lucide="bell" class="h-5 w-5 mr-3 text-slate-400"></i>
                            Notifications
                        </a>
                        <a href="#" class="flex items-center px-3 py-2 text-sm font-medium rounded-lg text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                            <i data-lucide="palette" class="h-5 w-5 mr-3 text-slate-400"></i>
                            Appearance
                        </a>
                    </nav>
                </div>

                <!-- Settings Content -->
                <div class="flex-1 space-y-6">
                    <div class="card rounded-xl overflow-hidden border border-slate-200 dark:border-slate-700">
                        <div class="p-6 border-b border-slate-200 dark:border-slate-700">
                            <h2 class="text-lg font-medium text-slate-900 dark:text-white">Profile Settings</h2>
                            <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Update your personal information and email address.</p>
                        </div>
                        
                        <div class="p-6">
                            <form id="settings-form" class="space-y-6">
                                
                                <div class="flex items-center gap-6">
                                    <div class="h-20 w-20 rounded-full bg-brand-100 dark:bg-brand-900/50 flex items-center justify-center text-brand-600 dark:text-brand-400 text-2xl font-bold">
                                        JD
                                    </div>
                                    <div>
                                        <button type="button" class="px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg shadow-sm text-sm font-medium text-slate-700 dark:text-slate-200 bg-white dark:bg-slate-700 hover:bg-slate-50 dark:hover:bg-slate-600 transition-colors">
                                            Change Avatar
                                        </button>
                                        <p class="mt-2 text-xs text-slate-500 dark:text-slate-400">JPG, GIF or PNG. 1MB max.</p>
                                    </div>
                                </div>

                                <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
                                    <div class="col-span-1 sm:col-span-2">
                                        <label for="profile-name" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Full Name</label>
                                        <input type="text" id="profile-name" value="John Doe" class="mt-1 block w-full border border-slate-300 dark:border-slate-600 rounded-lg shadow-sm py-2 px-3 focus:outline-none focus:ring-brand-500 focus:border-brand-500 sm:text-sm bg-white dark:bg-slate-700 text-slate-900 dark:text-white transition-colors">
                                    </div>

                                    <div class="col-span-1 sm:col-span-2">
                                        <label for="profile-email" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Email Address</label>
                                        <input type="email" id="profile-email" value="user@example.com" class="mt-1 block w-full border border-slate-300 dark:border-slate-600 rounded-lg shadow-sm py-2 px-3 focus:outline-none focus:ring-brand-500 focus:border-brand-500 sm:text-sm bg-white dark:bg-slate-700 text-slate-900 dark:text-white transition-colors">
                                    </div>
                                </div>

                                <div class="pt-4 flex justify-end">
                                    <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-lg text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-colors">
                                        Save Changes
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="js/layout.js"></script>
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
