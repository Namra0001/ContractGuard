<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContractGuard - Settings</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="dashboard-layout">
        <nav class="sidebar">
            <div class="logo">ContractGuard</div>
            <ul class="nav-links">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="upload.html">Upload</a></li>
                <li><a href="analysis.html">Analysis</a></li>
                <li><a href="chat.html">Chat</a></li>
                <li><a href="compare.html">Compare</a></li>
                <li><a href="deadlines.html">Deadlines</a></li>
                <li><a href="settings.html" class="active">Settings</a></li>
                <li><a href="#" id="logout-btn">Logout</a></li>
            </ul>
        </nav>
        <main class="content">
            <header>
                <h2>Account Settings</h2>
            </header>
            <div class="card">
                <form id="settings-form">
                    <div class="form-group">
                        <label for="profile-name">Name</label>
                        <input type="text" id="profile-name" value="User">
                    </div>
                    <div class="form-group">
                        <label for="profile-email">Email</label>
                        <input type="email" id="profile-email" value="user@example.com">
                    </div>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </form>
            </div>
        </main>
    </div>
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>
